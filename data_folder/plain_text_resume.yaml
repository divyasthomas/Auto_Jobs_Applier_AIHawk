projects:
  - name: "Implementing Multi-Agent RL and Vision-Based Controllers for Self-Driving Vehicles in Ice-Hockey Simulations (PyTorch, DDPG, TD3, U-Net)"
    description: "I designed and implemented an AI agent to play ice hockey in pyTuxKart, a heavily modified version of SuperTuxKart for educational purposes. This paper discusses the motivation, methods, evaluation metrics, and results obtained by the trained agent. The agent used input images and its current state to generate actions for scoring goals against opponent teams. It was evaluated against benchmark TA Agents bundled with the game environment. The final image-based agent achieved a performance score of 76% against the benchmark agents."
    link: "https://github.com/divyasthomas/robo-ice-hockey/blob/main/project_report.pdf"

  - name: "Text Sequence Prediction with Multi-Head Self-Attention Transformers (PyTorch, NumPy, Hugging Face )"
    description: "This project focuses on implementing a Transformer-based language model designed to predict the next character in a text sequence"
    link: "https://github.com/divyasthomas/self-attention-transformers/tree/main"
 
  - name: "Fact-Checking with Word Overlap and Textual Entailment Models Based on DeBERTa-v3(PyTorch, TF-IDF, NumPy)"
    description: "This project is designed to evaluate the accuracy of various fact-checking models using given passages and labeled fact examples. The system supports multiple fact-checking methods and provides detailed evaluation metrics for assessing the performance of these methods."
    link: "https://github.com/divyasthomas/Fact-Checking-Framework/tree/main"

  - name: "Improving Financial Sentiment Classification on ELECTRA using Adversarial Attacks (PyTorch, ELECTRA, TextFooler, BAE)"
    description: "This project explores sentiment analysis in finance, focusing on classifying text as positive, negative, or neutral using a pre-trained ELECTRA-small model. The baseline achieved 85.47% accuracy on the Financial PhraseBank dataset, with improvements to 90.15% after augmenting with adversarial examples. This approach addressed misclassifications and enhanced the model's generalization to unseen data, distinguishing it from other works."
    link: "https://github.com/divyasthomas/Electra-AdversarialAttacks/blob/main/AdversarialwithElectra.pdf"

  - name: "Forecasting S&P 500 Index Closing Price using LSTM and FinBERT (TensorFlow,Python)"
    description: "This project employed LSTM models to forecast the next day's S&P 500 closing price, using data from 2010-2020, including sentiment scores from financial headlines via finBERT. Single-layer LSTMs outperformed multi-layer models, with the best model achieving high accuracy during the volatile Covid-19 period. However, sentiment data from headlines did not enhance prediction accuracy, indicating its limited value in this context."
    link: "https://github.com/divyasthomas/Predicting-s-P-500-using-LSTM-and-FinBERT/blob/main/Final%20Report-Divya%20Thomas.pdf"


  - name: "Classifying Book Reviews Using Natural Language Processing (NumPy, Pandas, Matplotlib, scikit-learn, NLTK, TF-IDF, VADER)"
    description: "Performed sentiment analysis on book reviews and compared it to the actual user rating in Python. Computed polarity scores using TextBlot and VADER, transformed text into Vector representations using TF-IDF and Doc2Vec. Created Churn plots for various classification models to select the best one"
    link: "https://github.com/divyasthomas/NLP-goodreads-book-reviews/blob/main/Final%20Project%20Report%20(1).pdf"

  - name: "Power BI Sales Dashboard"
    description: "Created using Power BI to visualize sales data stored in a MySQL database. Used MySQL queries to explore database. Loaded into Power BI, modeled data using star schema design, cleaned and transformed data using Power Query Editor."
    link: "https://github.com/divyasthomas/Sales-Analytics-Interactive-Dashboard"

  - name: "Real-time Crime Looker Dashboard"
    description: "An Interactive Dashboard created using google data studio/ Looker which allows the user to explore the Chicago crimes dataset (crimes reported to the Chicago police from 2001 to present). The data in the dashboard is updated every 12 hours."
    link: "https://github.com/divyasthomas/Interactive-Dashboard-with-live-data-Google-Data-Studio-/blob/master/README.md"
  
  - name: "Climate Change Shiny R Dashboard"
    description: "A shiny app that allows user to explore Canadian climate change data in real-time."
    link: "https://github.com/divyasthomas/ShinyR-Interactive-Dashboard?tab=readme-ov-file"   

  - name: "Social Media Android App With Real-Time Interactive Feed, Firebase Authentication, and Storage(Kotlin/Java, Firebase, Firestore)"
    description: "Instamate is a social media app that offers real-time interactive feeds, case-insensitive search and follow functionality, customizable user profiles, and seamless post creation with Firebase authentication and storage."
    link: "https://github.com/divyasthomas/Instamate/tree/main"

  - name: "Music Player With Playback, Navigation, Shuffle, and Customizable Settings (Android Media Player API, Kotlin/Java, Coroutines)"
    description: "Multi-Threaded Chat Application in C With Signalling and Mutex Locks (Makefile, pthread) using UDP"
